[project]
name = "trusttriage-ai"
version = "1.0.0"
description = "Support ticket triage with confidence-based human review"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]

[tool.vercel]
entrypoint = "api:app"
